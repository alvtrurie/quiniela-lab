<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUINIELA LAB</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e9f1fb;background:#0b1423}*{box-sizing:border-box}body{margin:0}header{background:#10243a;padding:22px max(18px,calc((100vw - 1080px)/2));border-bottom:1px solid #28405b}h1{margin:0;font-size:27px}header p{color:#a7bad0;margin:6px 0 0}.wrap{max-width:1080px;margin:auto;padding:22px 16px}nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #3b5975;border-radius:9px;background:#18334f;color:white;padding:10px 14px}button.active,button.primary{background:#35b897;color:#061e22;border-color:#35b897;font-weight:700}button:disabled{opacity:.4;cursor:not-allowed}.panel{background:#122439;border:1px solid #2c425b;border-radius:13px;padding:20px;margin-bottom:16px}.muted{color:#a8bbd0}.small{font-size:13px}.error{color:#ffb1a8}.success{color:#9de3bd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{padding:14px;background:#1b344e;border-radius:10px}label{display:block;margin:12px 0 5px}select,input{background:#0d1d30;color:white;border:1px solid #4a627d;border-radius:8px;padding:10px;width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.game{border-bottom:1px solid #30455e;padding:14px 0}.game:last-child{border:0}.probs{display:flex;gap:8px;margin:8px 0}.probs span{background:#203c57;border-radius:7px;padding:7px 10px}.pick{display:flex;gap:5px}.pick button{padding:8px 11px}.pick .selected{background:#35b897;color:#061e22}a{color:#8bd9ff}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #30455e;text-align:left}@media(max-width:600px){.panel{padding:14px}h1{font-size:23px}}
</style></head><body>
<header><h1>⚽ QUINIELA LAB</h1><p>Estadísticas, probabilidades y constructor de columnas · Gratis</p></header>
<div class="wrap"><nav><button data-tab="pronosticos" class="active">Pronósticos</button><button data-tab="columnas">Mis columnas</button><button data-tab="radar">Radar de jornadas</button><button data-tab="fuentes">Datos y método</button></nav><main id="app"></main></div>
<script>
const ROOT='./data/';let data=null,stats=null,tab='pronosticos',liga='SP1',local='',visitante='',columnas=JSON.parse(localStorage.getItem('ql_columnas')||'[]'),borrador=Array(14).fill('1'),pleno=['0','0'];
const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
async function load(){try{const r=await Promise.all([fetch(ROOT+'pronosticos.json?'+Date.now()),fetch(ROOT+'estadisticas.json?'+Date.now())]);if(r.some(x=>!x.ok))throw Error('No se han podido descargar los archivos JSON');[data,stats]=await Promise.all(r.map(x=>x.json()));render()}catch(e){app.innerHTML='<div class="panel error">No se pudieron cargar los datos: '+esc(e.message)+'. Revisa la última ejecución de GitHub Actions.</div>'}}
function equipos(){return [...new Set((data?.competiciones?.[liga]||[]).flatMap(x=>[x.local,x.visitante]))].sort()}
function opts(items,selected){return items.map(x=>'<option value="'+esc(x)+'" '+(x===selected?'selected':'')+'>'+esc(x)+'</option>').join('')}
function render(){if(!data){app.innerHTML='<div class="panel">Cargando datos…</div>';return}({pronosticos:renderPred,columnas:renderCol,radar:renderRadar,fuentes:renderFuentes}[tab])()}
function renderPred(){let ts=equipos();if(!ts.includes(local))local=ts[0]||'';if(!ts.includes(visitante)||visitante===local)visitante=ts.find(x=>x!==local)||'';let p=(data.competiciones[liga]||[]).find(x=>x.local===local&&x.visitante===visitante);app.innerHTML='<div class="panel"><h2>Probabilidades de enfrentamientos</h2><p class="muted">Modelo estadístico, no boletín oficial. Selecciona un enfrentamiento para consultar su estimación.</p><div class="grid"><div><label>Competición</label><select id="liga">'+opts(Object.keys(data.competiciones),liga)+'</select></div><div><label>Equipo local</label><select id="local">'+opts(ts,local)+'</select></div><div><label>Equipo visitante</label><select id="visitante">'+opts(ts.filter(x=>x!==local),visitante)+'</select></div></div></div>'+(p?'<div class="panel"><h2>'+esc(local)+' — '+esc(visitante)+'</h2><div class="grid">'+['1','X','2'].map(s=>'<div class="stat"><div class="muted">'+({1:'Victoria local',X:'Empate',2:'Victoria visitante'}[s])+'</div><h2>'+Number(p.probabilidades[s]).toFixed(1)+'%</h2></div>').join('')+'</div><p>Signo más probable: <strong>'+esc(p.recomendado)+'</strong> · Goles esperados: '+esc(p.goles_esperados.local)+' — '+esc(p.goles_esperados.visitante)+'</p><p class="small muted">Estimación Poisson; no incluye cuotas, alineaciones, lesiones ni mercado de apuestas.</p></div>':'<div class="panel">No hay pronóstico disponible para este encuentro.</div>');document.getElementById('liga').onchange=e=>{liga=e.target.value;local='';visitante='';render()};document.getElementById('local').onchange=e=>{local=e.target.value;visitante='';render()};document.getElementById('visitante').onchange=e=>{visitante=e.target.value;render()}}
function save(){localStorage.setItem('ql_columnas',JSON.stringify(columnas))}
function renderCol(){app.innerHTML='<div class="panel"><h2>Constructor de columnas</h2><p class="muted">Crea y guarda columnas independientes. Los partidos todavía no están vinculados al boleto oficial: cada fila representa una posición del 1 al 14.</p><div id="games">'+borrador.map((v,i)=>'<div class="game"><div class="row"><strong>Partido '+(i+1)+'</strong><div class="pick">'+['1','X','2'].map(s=>'<button data-i="'+i+'" data-s="'+s+'" class="'+(v===s?'selected':'')+'">'+s+'</button>').join('')+'</div></div></div>').join('')+'</div><h3>Pleno al 15</h3><div class="grid">'+[0,1].map(i=>'<div><label>Goles '+(i?'visitante':'local')+'</label><select data-pleno="'+i+'">'+opts(['0','1','2','M'],pleno[i])+'</select></div>').join('')+'</div><p><button class="primary" id="guardar">Guardar columna</button></p></div><div class="panel"><h2>Columnas guardadas ('+columnas.length+')</h2>'+(columnas.length?columnas.map((c,i)=>'<div class="game"><div><strong>Columna '+(i+1)+'</strong> · '+c.signos.join(' ')+' · Pleno '+c.pleno.join('-')+'</div><p><button data-dup="'+i+'">Duplicar</button> <button data-del="'+i+'">Eliminar</button></p></div>').join(''):'<p class="muted">Todavía no has guardado ninguna columna.</p>')+'<p class="muted small">Se guardan en este navegador, no en tu cuenta de GitHub.</p></div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{borrador[+b.dataset.i]=b.dataset.s;renderCol()});document.querySelectorAll('[data-pleno]').forEach(s=>s.onchange=()=>{pleno[+s.dataset.pleno]=s.value});document.getElementById('guardar').onclick=()=>{columnas.push({signos:[...borrador],pleno:[...pleno]});save();renderCol()};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{columnas.splice(+b.dataset.del,1);save();renderCol()});document.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{columnas.push(JSON.parse(JSON.stringify(columnas[+b.dataset.dup])));save();renderCol()})}
function renderRadar(){app.innerHTML='<div class="panel"><h2>Radar de jornadas</h2><p class="muted">Pendiente de integrar la composición oficial y los porcentajes apostados. No mostramos una recomendación económica sin esos datos.</p><div class="grid"><div class="stat"><strong>Presupuesto máximo</strong><h2>10 €</h2></div><div class="stat"><strong>Precio por apuesta sencilla</strong><h2>0,75 €</h2></div><div class="stat"><strong>Máximo de columnas</strong><h2>13</h2></div></div><p class="small muted">13 × 0,75 € = 9,75 €. Este límite no implica que jugar sea rentable.</p></div>'}
function renderFuentes(){let n=Object.fromEntries(Object.entries(stats?.competiciones||{}).map(([k,v])=>[k,v.length]));app.innerHTML='<div class="panel"><h2>Origen de los datos</h2><p>Fuente histórica: <a href="https://www.football-data.co.uk/" target="_blank" rel="noopener">football-data.co.uk</a>. Actualización: '+esc(data.actualizado||'no disponible')+'.</p><div class="grid">'+Object.entries(n).map(([k,v])=>'<div class="stat"><strong>'+esc(k)+'</strong><h2>'+v+'</h2><span class="muted">partidos finalizados</span></div>').join('')+'</div><h3>Método</h3><p>Modelo Poisson basado en goles marcados y recibidos en casa y fuera, con suavizado de muestras pequeñas. Calcula probabilidades de resultados posibles y normaliza 1-X-2.</p><h3>Limitaciones</h3><p>No cubre todavía los partidos de selecciones, fútbol femenino u otras competiciones. No incorpora cuotas, distribución de apuestas ni calendario oficial. Las probabilidades son estimaciones, no resultados garantizados.</p><p><a href="https://github.com/alvtrurie/quiniela-lab" target="_blank" rel="noopener">Ver código y datos en GitHub</a></p></div>'}
load();
</script></body></html>
