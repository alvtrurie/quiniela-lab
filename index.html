<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUINIELA LAB</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e9f1fb;background:#0b1423}*{box-sizing:border-box}body{margin:0}header{background:#10243a;padding:22px max(18px,calc((100vw - 1080px)/2));border-bottom:1px solid #28405b}h1{margin:0;font-size:27px}header p{color:#a7bad0;margin:6px 0 0}.wrap{max-width:1080px;margin:auto;padding:22px 16px}nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #3b5975;border-radius:9px;background:#18334f;color:white;padding:10px 14px}button.active,button.primary{background:#35b897;color:#061e22;border-color:#35b897;font-weight:700}button:disabled{opacity:.4;cursor:not-allowed}.panel{background:#122439;border:1px solid #2c425b;border-radius:13px;padding:20px;margin-bottom:16px}.muted{color:#a8bbd0}.small{font-size:13px}.error{color:#ffb1a8}.success{color:#9de3bd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{padding:14px;background:#1b344e;border-radius:10px}label{display:block;margin:12px 0 5px}select,input{background:#0d1d30;color:white;border:1px solid #4a627d;border-radius:8px;padding:10px;width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.game{border-bottom:1px solid #30455e;padding:14px 0}.game:last-child{border:0}.probs{display:flex;gap:8px;margin:8px 0}.probs span{background:#203c57;border-radius:7px;padding:7px 10px}.pick{display:flex;gap:5px}.pick button{padding:8px 11px}.pick .selected{background:#35b897;color:#061e22}a{color:#8bd9ff}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #30455e;text-align:left}@media(max-width:600px){.panel{padding:14px}h1{font-size:23px}}
</style></head><body>
<header><h1>⚽ QUINIELA LAB</h1><p>Estadísticas, probabilidades y constructor de columnas · Gratis</p></header>
<div class="wrap"><nav><button data-tab="pronosticos" class="active">Pronósticos</button><button data-tab="columnas">Mis columnas</button><button data-tab="radar">Radar de jornadas</button><button data-tab="fuentes">Datos y método</button></nav><main id="app"></main></div>
<script>
const ROOT='./data/';let diagnostico=null;let estadoJornada=null;let jornada=null;let data=null,stats=null,tab='pronosticos',liga='SP1',local='',visitante='',columnas=JSON.parse(localStorage.getItem('ql_columnas')||'[]'),borrador=Array(14).fill('1'),pleno=['0','0'];
const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
async function load(){try{const r=await Promise.all([fetch(ROOT+'pronosticos.json?'+Date.now()),fetch(ROOT+'estadisticas.json?'+Date.now()),fetch(ROOT+'jornada_actual.json?'+Date.now()),fetch(ROOT+'estado_jornada.json?'+Date.now()),fetch(ROOT+'diagnostico_fuentes.json?'+Date.now())]);if(r.slice(0,3).some(x=>!x.ok))throw Error('No se han podido descargar los archivos JSON');[data,stats,jornada]=await Promise.all(r.slice(0,3).map(x=>x.json()));estadoJornada=r[3].ok?await r[3].json():{publicable:false,motivos:['Pendiente de comprobar la jornada']};diagnostico=r[4].ok?await r[4].json():null;render()}catch(e){app.innerHTML='<div class="panel error">No se pudieron cargar los datos: '+esc(e.message)+'. Revisa la última ejecución de GitHub Actions.</div>'}}
function equipos(){return [...new Set((data?.competiciones?.[liga]||[]).flatMap(x=>[x.local,x.visitante]))].sort()}
function opts(items,selected){return items.map(x=>'<option value="'+esc(x)+'" '+(x===selected?'selected':'')+'>'+esc(x)+'</option>').join('')}
function render(){if(!data){app.innerHTML='<div class="panel">Cargando datos…</div>';return}({pronosticos:renderPred,columnas:renderCol,radar:renderRadar,fuentes:renderFuentes}[tab])()}
function claveEquipo(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/^r /,'real ').replace(/^cd /,'').replace(/^fc /,'').replace(/^sp /,'sporting ').replace(/^at /,'atletico ')}
function pronosticoPartido(p){if(!p||/\(f\)/i.test(p.local+' '+p.visitante))return null;let alias={'valladolid':'real valladolid','castellon':'castellon','sociedad b':'real sociedad b','sporting':'sporting gijon','andorra':'andorra','oviedo':'real oviedo','cadiz':'cadiz','almeria':'almeria'};let norm=s=>alias[claveEquipo(s)]||claveEquipo(s);let opciones=[];for(let [comp,filas] of Object.entries(data.competiciones||{})){let a=filas.filter(x=>norm(x.local)===norm(p.local)&&norm(x.visitante)===norm(p.visitante));if(a.length===1)opciones.push(a[0]);}return opciones.length===1?opciones[0]:null}
function renderPred(){let partidos=jornada?.partidos||[];let validada=jornada?.estado==='verificada'&&estadoJornada?.publicable===true&&(!jornada?.fecha_fin||jornada.fecha_fin>=new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Madrid'}));let bloques=(validada?partidos:[]).map(p=>{let calc=validada?pronosticoPartido(p):null;return '<div class="game"><div class="row"><strong>'+p.posicion+'. '+esc(p.local)+' — '+esc(p.visitante)+'</strong></div>'+(calc?'<div class="probs">'+['1','X','2'].map(s=>'<span>'+s+': '+Number(calc.probabilidades[s]).toFixed(1)+'%</span>').join('')+'</div><div class="small success">Mayor probabilidad: '+esc(calc.recomendado)+' · Modelo Poisson</div>':'<div class="small muted">Sin estimación propia validada para esta competición</div>')+'</div>'}).join('');app.innerHTML='<div class="panel"><h2>Jornada '+esc(jornada?.numero||'—')+' · '+esc(jornada?.fecha_inicio||'')+' a '+esc(jornada?.fecha_fin||'')+'</h2><p class="muted">'+(validada?'Composición contrastada. Probabilidades estimadas, no cuotas.':'⚠️ JORNADA NO DISPONIBLE O CADUCADA. Ocultamos la composición y los pronósticos asociados para evitar apuestas con datos incorrectos.')+'</p>'+bloques+(validada?'<div class="game"><strong>Pleno al 15: '+esc(jornada?.pleno?.local)+' — '+esc(jornada?.pleno?.visitante)+'</strong><p class="muted small">Sin modelo de goles para selecciones por ahora.</p></div>':'')+'</div><div class="panel"><h3>Consultar otros enfrentamientos</h3><p class="muted small">Estos partidos no forman parte necesariamente de la jornada oficial.</p><div class="grid"><div><label>Liga</label><select id="liga">'+opts(Object.keys(data.competiciones),liga)+'</select></div><div><label>Local</label><select id="local">'+opts(equipos(),local||equipos()[0])+'</select></div><div><label>Visitante</label><select id="visitante">'+opts(equipos(),visitante||equipos()[1])+'</select></div></div><div id="extra"></div></div>';document.getElementById('liga').onchange=e=>{liga=e.target.value;local='';visitante='';renderPred()};document.getElementById('local').onchange=e=>{local=e.target.value;renderExtra()};document.getElementById('visitante').onchange=e=>{visitante=e.target.value;renderExtra()};renderExtra()}
function renderExtra(){let a=document.getElementById('local'),b=document.getElementById('visitante');if(!a||!b)return;local=a.value;visitante=b.value;let p=(data.competiciones[liga]||[]).find(x=>x.local===local&&x.visitante===visitante);document.getElementById('extra').innerHTML=p&&local!==visitante?'<p>1: '+p.probabilidades['1']+'% · X: '+p.probabilidades.X+'% · 2: '+p.probabilidades['2']+'% · Recomendado: <strong>'+p.recomendado+'</strong></p>':'<p class="muted small">Selecciona dos equipos diferentes.</p>'}
function save(){localStorage.setItem('ql_columnas',JSON.stringify(columnas))}
function renderCol(){app.innerHTML='<div class="panel"><h2>Constructor de columnas</h2><p class="muted">Crea y guarda columnas independientes. Si no hay jornada verificada, las posiciones 1–14 son genéricas y NO deben usarse para presentar apuestas.</p><div id="games">'+borrador.map((v,i)=>'<div class="game"><div class="row"><strong>'+(estadoJornada?.publicable&&jornada?.fecha_fin>=new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Madrid'})&&jornada?.estado==='verificada'&&jornada?.partidos?.[i]?esc(jornada.partidos[i].local)+' — '+esc(jornada.partidos[i].visitante):'Partido '+(i+1))+'</strong><div class="pick">'+['1','X','2'].map(s=>'<button data-i="'+i+'" data-s="'+s+'" class="'+(v===s?'selected':'')+'">'+s+'</button>').join('')+'</div></div></div>').join('')+'</div><h3>Pleno al 15</h3><div class="grid">'+[0,1].map(i=>'<div><label>Goles '+(i?'visitante':'local')+'</label><select data-pleno="'+i+'">'+opts(['0','1','2','M'],pleno[i])+'</select></div>').join('')+'</div><p><button class="primary" id="guardar">Guardar columna</button></p></div><div class="panel"><h2>Columnas guardadas ('+columnas.length+')</h2>'+(columnas.length?columnas.map((c,i)=>'<div class="game"><div><strong>Columna '+(i+1)+'</strong> · '+c.signos.join(' ')+' · Pleno '+c.pleno.join('-')+'</div><p><button data-dup="'+i+'">Duplicar</button> <button data-del="'+i+'">Eliminar</button></p></div>').join(''):'<p class="muted">Todavía no has guardado ninguna columna.</p>')+'<p class="muted small">Se guardan en este navegador, no en tu cuenta de GitHub. Las columnas no se actualizan automáticamente al cambiar de jornada.</p></div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{borrador[+b.dataset.i]=b.dataset.s;renderCol()});document.querySelectorAll('[data-pleno]').forEach(s=>s.onchange=()=>{pleno[+s.dataset.pleno]=s.value});document.getElementById('guardar').onclick=()=>{columnas.push({signos:[...borrador],pleno:[...pleno]});save();renderCol()};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{columnas.splice(+b.dataset.del,1);save();renderCol()});document.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{columnas.push(JSON.parse(JSON.stringify(columnas[+b.dataset.dup])));save();renderCol()})}
function renderRadar(){app.innerHTML='<div class="panel"><h2>Radar de jornadas</h2><p class="muted">Pendiente de integrar la composición oficial y los porcentajes apostados. No mostramos una recomendación económica sin esos datos.</p><div class="grid"><div class="stat"><strong>Presupuesto máximo</strong><h2>10 €</h2></div><div class="stat"><strong>Precio por apuesta sencilla</strong><h2>0,75 €</h2></div><div class="stat"><strong>Máximo de columnas</strong><h2>13</h2></div></div><p class="small muted">13 × 0,75 € = 9,75 €. Este límite no implica que jugar sea rentable.</p></div>'}
function renderFuentes(){let fuentes=diagnostico?.fuentes||{};let estado='<h3>Estado del calendario</h3><p class="muted small">Jornada '+esc(jornada?.numero||'—')+' · '+(estadoJornada?.publicable?'Composición marcada como verificada':'Pendiente de verificar')+'. Actualización automática condicionada a la coincidencia completa de dos fuentes y fechas futuras válidas.</p><p class="muted small">Última comprobación: '+esc(estadoJornada?.comprobado||'Sin datos')+'.</p><h3>Conectividad de fuentes</h3>'+(diagnostico?'<p class="muted small">Última consulta: '+esc(diagnostico.consultado||'—')+'</p>'+Object.entries(fuentes).map(([k,v])=>'<p class="small">'+esc(k)+': <strong class="'+(v.accesible?'success':'error')+'">'+(v.accesible?'Accesible':'Sin acceso')+'</strong>'+(v.http?' (HTTP '+esc(v.http)+')':'')+'</p>').join(''):'<p class="muted small">Aún no se ha ejecutado el monitor desde GitHub Actions.</p>');let n=Object.fromEntries(Object.entries(stats?.competiciones||{}).map(([k,v])=>[k,v.length]));app.innerHTML='<div class="panel">'+estado+'<h2>Origen de los datos</h2><p>Fuente histórica: <a href="https://www.football-data.co.uk/" target="_blank" rel="noopener">football-data.co.uk</a>. Actualización: '+esc(data.actualizado||'no disponible')+'.</p><div class="grid">'+Object.entries(n).map(([k,v])=>'<div class="stat"><strong>'+esc(k)+'</strong><h2>'+v+'</h2><span class="muted">partidos finalizados</span></div>').join('')+'</div><h3>Método</h3><p>Modelo Poisson basado en goles marcados y recibidos en casa y fuera, con suavizado de muestras pequeñas. Calcula probabilidades de resultados posibles y normaliza 1-X-2.</p><h3>Limitaciones</h3><p>No cubre todavía los partidos de selecciones, fútbol femenino u otras competiciones. No incorpora cuotas ni distribución de apuestas. El calendario procede de fuentes públicas contrastadas, no de una API oficial. Las probabilidades son estimaciones, no resultados garantizados.</p><p><a href="https://github.com/alvtrurie/quiniela-lab" target="_blank" rel="noopener">Ver código y datos en GitHub</a></p></div>'}
load();
</script></body></html>
