name: Evaluación del selector de columnas
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimento_selector.py'
      - '.github/workflows/selector.yml'
permissions:
  contents: write
jobs:
  evaluar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comparar presupuestos y cobertura de empates
        run: python experimento_selector.py
      - name: Publicar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/experimento_selector.json
          if ! git diff --cached --quiet; then
            git commit -m "Publicar evaluación de selección de columnas"
            git pull --rebase origin main
            git push
          fi
