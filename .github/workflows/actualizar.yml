name: Actualizar datos de Quiniela Lab

on:
  push:
    branches: [main]
    paths:
      - 'actualizar_jornada.py'
      - 'test_actualizar_jornada.py'
      - 'validar_jornada.py'
      - 'estadisticas_extra.py'
      - 'test_estadisticas_extra.py'
      - 'pronosticos.py'
      - '.github/workflows/actualizar.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'

concurrency:
  group: quiniela-lab-actualizacion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar analizador HTML
        run: python -m pip install beautifulsoup4==4.12.3

      - name: Probar extractor de jornadas
        run: python -m unittest -v test_actualizar_jornada.py test_estadisticas_extra.py

      - name: Descargar estadísticas
        run: |
          mkdir -p data
          python - <<'PY'
          import csv, io, json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          resultado = {
              "actualizado": datetime.now(timezone.utc).isoformat(),
              "temporada": "2026-2027",
              "fuente": "football-data.co.uk",
              "competiciones": {}
          }
          for liga in ("SP1", "SP2"):
              url = f"https://www.football-data.co.uk/mmz4281/2627/{liga}.csv"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "QuinielaLab/0.5"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      contenido = response.read().decode("utf-8-sig", errors="replace")
                  filas = list(csv.DictReader(io.StringIO(contenido)))
                  partidos = [
                      {"fecha": f.get("Date"), "local": f.get("HomeTeam"),
                       "visitante": f.get("AwayTeam"), "goles_local": f.get("FTHG"),
                       "goles_visitante": f.get("FTAG"), "resultado": f.get("FTR")}
                      for f in filas
                      if f.get("HomeTeam") and f.get("AwayTeam") and f.get("FTR") in ("H", "D", "A")
                  ]
                  if not partidos:
                      raise ValueError("Sin partidos finalizados")
                  resultado["competiciones"][liga] = partidos
                  print(f"{liga}: {len(partidos)} partidos")
              except Exception as e:
                  print(f"ERROR {liga}: {e}")
                  raise

          Path("data/estadisticas.json").write_text(
              json.dumps(resultado, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
      - name: Descargar resultados complementarios (Liga F y UEFA)
        run: python estadisticas_extra.py
      - name: Calcular pronósticos
        run: python pronosticos.py
      # Consulta oficial desactivada temporalmente: HTTP 403
      # - name: Consultar jornadas oficiales
      #   run: python jornadas.py
      - name: Comprobar fuentes alternativas de jornadas
        run: python actualizar_jornada.py
      - name: Validar jornada sin publicar datos dudosos
        run: python validar_jornada.py
      - name: Guardar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estadisticas.json data/estadisticas_extra.json data/pronosticos.json data/estado_jornada.json data/diagnostico_fuentes.json data/jornada_actual.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estadísticas de fútbol"
            for intento in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$intento" -eq 3 ]; then exit 1; fi
              sleep 2
            done
          fi
