name: Validar fuentes prepartido
on:
  workflow_dispatch:
  push:
    paths:
      - 'fuentes_prepartido.py'
      - '.github/workflows/fuentes-prepartido.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar fechas y esquemas
        run: python fuentes_prepartido.py
