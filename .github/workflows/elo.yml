name: Comparativa Elo y Poisson
on:
  workflow_dispatch:
  push:
    paths:
      - 'experimento_elo.py'
      - '.github/workflows/elo.yml'
permissions:
  contents: write
jobs:
  evaluar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Simular dos temporadas sin fuga temporal
        run: python experimento_elo.py
      - name: Publicar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/experimento_elo.json
          if ! git diff --cached --quiet; then
            git commit -m "Publicar comparativa Elo y Poisson"
            git pull --rebase origin main
            git push
          fi
