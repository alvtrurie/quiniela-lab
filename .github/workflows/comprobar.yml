name: Comprobar código de Quiniela Lab
on:
  push:
    branches: [main]
    paths:
      - 'actualizar_jornada.py'
      - 'test_actualizar_jornada.py'
      - 'validar_jornada.py'
      - 'estadisticas_extra.py'
      - 'test_estadisticas_extra.py'
      - 'pronosticos.py'
      - 'generador.js'
      - 'dashboard.js'
      - 'actualizar_xg.py'
      - 'resultados.js'
      - 'test_generador.cjs'
      - 'index.html'
      - '.github/workflows/comprobar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Compilar código Python
        run: python -m compileall -q actualizar_jornada.py validar_jornada.py test_actualizar_jornada.py estadisticas_extra.py pronosticos.py actualizar_xg.py test_estadisticas_extra.py
      - name: Comprobar JavaScript
        run: |
          node --check dashboard.js
          node --check generador.js
          node --check resultados.js
          node --check test_generador.cjs
          node test_generador.cjs
      - name: Ejecutar pruebas sin red
        run: python -m unittest -v test_actualizar_jornada.py test_estadisticas_extra.py
